include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"
composer-lint:
  allow_failure: false
cspell:
  allow_failure: false
eslint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
phpunit:
  allow_failure: false
composer:
  variables:
    # The gitlab_templates default-ref currently pins DRUPAL_CORE (CORE_STABLE)
    # to 11.3.12, which is below this branch's core_version_requirement
    # (^11.4 || ^12). Pin the "current" variant to a released ^11.4 core so
    # the composer + phpunit jobs install a compatible Drupal core.
    DRUPAL_CORE: '11.4.3'
