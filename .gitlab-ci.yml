include:
- project: $_GITLAB_TEMPLATES_REPO
  ref: $_GITLAB_TEMPLATES_REF
  file:
  - /includes/include.drupalci.main.yml
  - /includes/include.drupalci.variables.yml
  - /includes/include.drupalci.workflows.yml
composer-lint:
  allow_failure: false
cspell:
  allow_failure: false
eslint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
phpunit:
  allow_failure: false
# Automated Functional Testing with webship-js (Playwright + Cucumber-js).
#
# Installs Drupal on SQLite from the composer-job artifacts, applies the
# entityqueue_form_widget_test recipe (test users/roles/subqueues/fixture
# content ship as recipe content + config -- no separate seed scripts),
# serves the site via drush runserver and runs the Gherkin acceptance
# suite headless in Chromium.
webship:
  stage: test
  allow_failure: false
  image:
    name: $_CONFIG_DOCKERHUB_ROOT/php-$PHP_VERSION-$PHP_IMAGE_VARIANT:$PHP_IMAGE_TAG
  needs:
  - composer
  variables:
    LAUNCH_URL: http://127.0.0.1:8888
    BROWSER: chromium
    HEADLESS: 'true'
    SLOW_MO: '0'
    FORCE_COLOR: '1'
    SITE_DB_URL: sqlite://localhost/sites/default/files/.eqfw-test.sqlite
  script:
  - export MODULE_DIR="${_WEB_ROOT}/modules/custom/${PROJECT_NAME:-$CI_PROJECT_NAME}"
  - 'echo "Module dir: $MODULE_DIR"'
  - test -x "${COMPOSER_BIN_DIR:-vendor/bin}/drush" || composer require --dev --no-interaction "drush/drush:^13"
  - DRUSH="${COMPOSER_BIN_DIR:-vendor/bin}/drush"
  - $DRUSH site:install minimal -y --db-url="$SITE_DB_URL" --site-name="EQFW Test" --account-name=admin
    --account-pass=admin
  - test -d "$CI_PROJECT_DIR/tests/recipes/entityqueue_form_widget_test" || { echo "recipe dir missing";
    ls -la "$CI_PROJECT_DIR/tests/recipes/" || true; ls -la web/modules/custom/entityqueue_form_widget/tests/recipes/
    || true; exit 1; }
  - $DRUSH recipe "$CI_PROJECT_DIR/tests/recipes/entityqueue_form_widget_test" -y
  - $DRUSH theme:enable olivero -y
  - $DRUSH config:set system.theme default olivero -y
  - $DRUSH php:eval '$n = \Drupal::entityTypeManager()->getStorage("node")->loadByProperties(["title"
    => "Filler node keeping the limited queue full"]); $n = reset($n); $sq = \Drupal\entityqueue\Entity\EntitySubqueue::load("test_limited_queue");
    if ($n && $sq && !$sq->hasItem($n)) { $sq->addItem($n); $sq->save(); }'
  - chmod -R 777 "${_WEB_ROOT}/sites/default/files"
  - $DRUSH runserver 127.0.0.1:8888 >/tmp/php-server.log 2>&1 &
  - for i in $(seq 1 20); do curl -s -o /tmp/login.html -w "%{http_code}" "$LAUNCH_URL/user/login" | grep
    -q 200 && break; sleep 1; done
  - grep -q 'edit-name' /tmp/login.html || (echo "=== php-server.log ==="; cat /tmp/php-server.log; echo
    "=== /user/login body ==="; tail -c 4000 /tmp/login.html; exit 1)
  - cd "$CI_PROJECT_DIR/tests"
  - npm install
  - npx playwright install --with-deps chromium || npx playwright install chromium
  - LAUNCH_URL="$LAUNCH_URL" BROWSER=chromium HEADLESS=true SLOW_MO=0 WEBSHIP_REPORT_ARGS="--json reports/cucumber_report.json
    --out reports/cucumber_report.html" npm test
  artifacts:
    when: always
    expire_in: 30 days
    paths:
    - tests/reports/
    - tests/screenshots/
